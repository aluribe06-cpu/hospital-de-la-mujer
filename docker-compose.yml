services:
  # ==============================================================================
  # 1. SERVICIO DE APLICACIÓN WEB (FRONTEND Y REPORTES)
  # ==============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: farmacia_hospital_mujer_web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
      - VIRTUAL_HOST=farmacia.hospitalmujer.salud.gob.mx
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - red_hospitalaria

  # ==============================================================================
  # 2. BASE DE DATOS SQL (POSTGRESQL 16 ENTERPRISE)
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: farmacia_hospital_mujer_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hospital_mujer_farmacia
      POSTGRES_USER: imss_admin
      POSTGRES_PASSWORD: hospital_mujer_secret_pass_2026
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imss_admin -d hospital_mujer_farmacia"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - red_hospitalaria

volumes:
  postgres_data:
    name: hospital_mujer_postgres_volume

networks:
  red_hospitalaria:
    name: red_hospital_mujer_imss
    driver: bridge
